name: Node.js build

on:
    push:
        branches: [master]
    pull_request:
        branches: ['**']

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x, 24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run lint
            - run: npm run format:check
            - run: npm run test:coverage
            - name: Restore mutation results
              if: matrix.node-version == '22.x'
              uses: actions/cache@v4
              with:
                  path: reports/stryker-incremental.json
                  key: stryker-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      stryker-${{ github.ref_name }}-
                      stryker-master-
            - name: Run mutation tests
              if: matrix.node-version == '22.x'
              run: npm run test:mutation

    e2e:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: 'npm'
            - name: Get the week number
              id: week
              run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
            - name: Restore the Obsidian download
              uses: actions/cache@v4
              with:
                  path: .e2e-cache
                  key: obsidian-${{ steps.week.outputs.week }}
            - run: sudo apt-get update && sudo apt-get install -y squashfs-tools xvfb xdotool
            - run: npm ci
            - run: npm run test:e2e

    commits:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
