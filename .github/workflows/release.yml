name: Release Obsidian plugin

on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+'
    workflow_dispatch:

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Check the tag is on the default branch
              run: |
                  git fetch origin "${{ github.event.repository.default_branch }}"
                  git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"

            - run: npm ci

            - name: Resolve the release tag
              id: release
              run: |
                  if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                    tag="$GITHUB_REF_NAME"
                  else
                    tag="$(node -p 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8")).version')"
                    if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
                      echo "Tag $tag already exists. Push the tag instead of running the workflow by hand." >&2
                      exit 1
                    fi
                  fi
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

            - name: Check the tag against the version files
              run: npm run release:verify -- "${{ steps.release.outputs.tag }}"

            - name: Check the code
              run: npm run check

            - name: Build plugin
              run: npm run build

            - name: Check the release files exist
              run: |
                  test -s main.js
                  test -s manifest.json
                  test -s styles.css

            - name: Attest build provenance
              if: ${{ !github.event.repository.private }}
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      styles.css

            - name: Write release notes
              run: npm run release:notes -- "${{ steps.release.outputs.tag }}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$GITHUB_SHA" > release-notes.md

            - name: Create draft release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.release.outputs.tag }}
                  VERIFY_TAG: ${{ github.ref_type == 'tag' && '--verify-tag' || '' }}
              run: |
                  gh release create "$TAG" \
                    --title="$TAG" \
                    --notes-file release-notes.md \
                    --target "$GITHUB_SHA" \
                    $VERIFY_TAG \
                    --draft \
                    main.js manifest.json styles.css
