name: Release Obsidian plugin

on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+'

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Check the tag is on the default branch
              run: |
                  git fetch origin "${{ github.event.repository.default_branch }}"
                  git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"

            - run: npm ci

            - name: Check the tag against the version files
              run: npm run release:verify -- "${GITHUB_REF_NAME}"

            - name: Check the code
              run: npm run check

            - name: Build plugin
              run: npm run build

            - name: Check the release files exist
              run: |
                  test -s main.js
                  test -s manifest.json
                  test -s styles.css

            - name: Attest build provenance
              if: ${{ !github.event.repository.private }}
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      styles.css

            - name: Write release notes
              run: npm run release:notes -- "${GITHUB_REF_NAME}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" > release-notes.md

            - name: Create draft release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "${GITHUB_REF_NAME}" \
                    --title="${GITHUB_REF_NAME}" \
                    --notes-file release-notes.md \
                    --verify-tag \
                    --draft \
                    main.js manifest.json styles.css
